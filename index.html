<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Odin-Landing-Page</title>
</head>
<body>
    <section class="main-section">
        <div class="container-1">
            <img src="images/photo-1585202900225-6d3ac20a6962.avif">
            <div class="odin-logo">
                <img src="images/odin-lined.png">
                <h1>ODIN</h1>
            </div>
        </div>
        <div class="container-2">
            <form>
                <div class="content bold">
                    <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started</p>
                    <p>You know you want to.</p>
                </div class="bold">
                <fieldset>
                    <p class="legend bold">Let's do this!</p>
                    <div class="input-container">
                        <div class ="row">
                            <div class="row-item">
                                <p><label for="firstname">FIRST NAME</label></p>
                                <p><input type="text" name="firstname" required></p>
                            </div>
                            <div class="row-item">
                                <p><label for="lastname">LAST NAME</label></p>
                                <p><input type="text" name="lastname" required></p>
                            </div>
                        </div>
                        <div class ="row">
                            <div class="row-item">
                                <p><label for="email">EMAIL</label></p>
                                <p><input type="email" name="email" required></p>
                            </div>
                            <div class="row-item">
                                <p><label for="phone-number">PHONE NUMBER</label></p>
                                <p><input type="number" name="phone-number" required></p>
                            </div>
                        </div>
                        <div class ="row">
                            <div class="row-item">
                                <p><label for="password">PASSWORD</label></p>
                                <p><input type="password" name="password" required></p>
                            </div>
                            <div class="row-item">
                                <p><label for="confirm-password">CONFIRM PASSWORD</label></p>
                                <p><input type="password" name="confirm-password" required></p>
                            </div>
                        </div>
                    </div>
                </fieldset>
                <div class="confirm">
                    <button>Create Account</button>
                    <p><a>Already have an account? Log in</a></p>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
